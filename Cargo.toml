[package]
name = "banqi-server"
version = "0.1.0"
edition = "2024"
description = "Banqi 暗棋对弈 HTTP 服务：axum REST API + ONNX 推理 + Gumbel MCTS AI 对手"

[[bin]]
name = "banqi-server"
path = "src/main.rs"

[dependencies]
banqi-core = { path = "../banqi-core" }
banqi-engine = { path = "../banqi-engine" }
# 共享应用层：MCTS 树视图 / 搜索执行 / 模型扫描（收敛 gui-server 重复逻辑）
banqi-app = { path = "../banqi-app" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 内嵌 Web 前端（banqi-frontend/dist）：debug 模式直接读文件系统（热改即生效），release 编译期打包进二进制
rust-embed = "8"
mime_guess = "2.0"

# 仅用于加载期校验模型输入维度与变体特征维度（精确锁定 rc.13，与 banqi-engine 的 ort API 对齐；
# 升级 ort 时须与 banqi-engine 的版本声明同步修改）
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"], optional = true }

[features]
default = ["onnx"]
# 透传到底层推理库的 feature（与 banqi-engine 对齐）
torch = ["banqi-engine/torch", "banqi-app/torch"]
onnx = ["banqi-engine/onnx", "dep:ort", "banqi-app/onnx"]
onnx-cuda = ["onnx", "banqi-engine/onnx-cuda"]
