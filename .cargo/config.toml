# ts-rs 导出基准目录：relative = true 以本 config 的父目录（banqi-server/）为基准，
# ../banqi-frontend/src/api/generated 即项目根下的 banqi-frontend/src/api/generated。
# 生成命令：cd banqi-server && cargo test -p bqsrv-dto -p bqsrv-app export_bindings
[env]
TS_RS_EXPORT_DIR = { value = "../banqi-frontend/src/api/generated", relative = true }
# u64/i64 等（elapsed_ms 等）按 number 生成，而非默认的 bigint（前端按 number 消费）
TS_RS_LARGE_INT = "number"
